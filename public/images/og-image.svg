<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="indigoGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#5B4BDB" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5B4BDB" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="85%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Squircle Gradient -->
    <linearGradient id="sqGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="sqBorder" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#5B4BDB" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#indigoGlow)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />
  <rect width="1200" height="630" fill="url(#goldGlow)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300 M 0 400 L 1200 400 M 0 500 L 1200 500" />
    <path d="M 150 0 L 150 630 M 300 0 L 300 630 M 450 0 L 450 630 M 600 0 L 600 630 M 750 0 L 750 630 M 900 0 L 900 630 M 1050 0 L 1050 630" />
  </g>

  <!-- Brand Emblem (120x120) -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="120" height="120" rx="32" fill="url(#sqGrad)" stroke="url(#sqBorder)" stroke-width="3" />
    <!-- Fold -->
    <path d="M 78 20 L 98 40 L 78 40 Z" fill="#38BDF8" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1.5" />
    <!-- G Ribbon -->
    <path
      d="M 80 38 C 68 28 50 25 40 32 C 25 40 18 58 20 75 C 23 92 35 102 55 102 C 70 102 83 95 88 80 C 88 75 88 70 88 68 L 58 68 C 55 68 53 71 53 74 C 53 78 55 79 58 79 L 75 79 C 73 88 63 93 53 91 C 40 90 33 80 33 68 C 33 53 40 40 53 38 C 60 35 70 38 78 42 Z"
      fill="#818CF8"
    />
    <!-- Star Accent -->
    <path d="M 92 18 Q 92 28 102 28 Q 92 28 92 38 Q 92 28 82 28 Q 92 28 92 18 Z" fill="#F59E0B" />
  </g>

  <!-- Brand Typography Lockup -->
  <g transform="translate(245, 120)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">Genova</text>
    <text x="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)">Profile</text>
    <rect x="400" y="-38" width="105" height="40" rx="10" fill="#312E81" stroke="#6366F1" stroke-width="1.5" />
    <text x="452.5" y="-12" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#A5B4FC" letter-spacing="1.5">STUDIO</text>
    <text y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#94A3B8" letter-spacing="3">CRAFT OUTSTANDING DOCUMENTS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 310)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
      Professional Resumes, Biodatas
    </text>
    <text y="75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="900" fill="#F8FAFC" letter-spacing="-1.5">
      &amp; Designer Invitations
    </text>
    <text y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="500" fill="#94A3B8">
      99+ ATS-friendly templates, authentic Vedic biodatas, and celebration cards.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 520)">
    <!-- Pill 1 -->
    <rect width="210" height="46" rx="23" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="23" r="6" fill="#10B981" />
    <text x="42" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">ATS Resume Builder</text>

    <!-- Pill 2 -->
    <rect x="230" width="230" height="46" rx="23" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <circle cx="254" cy="23" r="6" fill="#F59E0B" />
    <text x="272" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">Vedic Hindu Biodatas</text>

    <!-- Pill 3 -->
    <rect x="480" width="220" height="46" rx="23" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <circle cx="504" cy="23" r="6" fill="#6366F1" />
    <text x="522" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">Designer Invitations</text>

    <!-- Pill 4 -->
    <rect x="720" width="180" height="46" rx="23" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <circle cx="744" cy="23" r="6" fill="#38BDF8" />
    <text x="762" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">Instant PDF A4</text>
  </g>

  <!-- Watermark URL -->
  <text x="1100" y="550" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#64748B" letter-spacing="1">
    genovaprofile.com
  </text>
</svg>
